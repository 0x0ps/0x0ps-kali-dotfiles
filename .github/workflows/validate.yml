name: Validate shell and configuration files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              jq empty "$file"
            done < <(find config -type f \( -name '*.json' -o -name '*.jsonc' \) -print0)
          fi
