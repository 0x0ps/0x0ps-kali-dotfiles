# 0x0ps Neon Matrix — tmux
set -g history-limit 10000
set -g allow-rename off
set -g default-shell /bin/zsh
set -g mouse on
set -g mode-keys vi

# Neon status line
set -g status on
set -g status-style "bg=#000000,fg=#D7F7D7"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#000000,bg=#A6FF00,bold] 0x0ps #[fg=#A6FF00,bg=#101010] #S "
set -g status-right "#[fg=#00FFFF,bg=#101010] %Y-%m-%d #[fg=#FF00AF,bg=#101010] %H:%M #[default]"
set -g window-status-format "#[fg=#667066,bg=#000000] #I:#W "
set -g window-status-current-format "#[fg=#000000,bg=#A6FF00,bold] #I:#W "
set -g pane-border-style "fg=#151515"
set -g pane-active-border-style "fg=#00FFFF"
set -g message-style "bg=#151515,fg=#A6FF00"
set -g mode-style "bg=#00FFFF,fg=#000000"

bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

unbind -T copy-mode MouseDragEnd1Pane
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
