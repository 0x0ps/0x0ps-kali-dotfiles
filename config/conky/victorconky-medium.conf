# 0x0ps VictorConky Enhanced — Neon Fuchsia Edition
# Based on Gictorbit/victorconky, customized for Kali + i3.

update_interval 1
total_run_times 0
net_avg_samples 1
cpu_avg_samples 1
imlib_cache_size 0
double_buffer yes
no_buffers yes
use_xft yes
xftfont Droid Sans:size=9
override_utf8_locale yes
text_buffer_size 2048

own_window yes
own_window_type desktop
own_window_transparent yes
own_window_hints undecorated,sticky,skip_taskbar,skip_pager
own_window_argb_visual yes
own_window_argb_value 0

alignment middle_right
gap_x 90
gap_y 0

minimum_size 280 0
maximum_width 320
default_bar_size 30 8

draw_shades no
draw_outline no
draw_borders no

default_color FF3EA5
color0 00E5FF
color1 FF3EA5
color2 FF3EA5
color3 4D8DFF

TEXT
${goto 210}${color0}${font Zekton:style=bold:size=13}${voffset 40}${exec whoami}
${voffset -45}${font Zekton:style=Bold:size=12}${color1}${goto 90}${uptime}
${goto 90}${color2}${font Zekton:style=Bold:size=12}${nodename}${color}${font}
${font Chinacat:size=12}${offset 70}${voffset 45}${time %B %d, %Y}
${voffset 8}${goto 65}${color3}${font Zekton:style=bold:size=30}${time %H:%M}${font}${color1}${goto 220}${font Zekton:style=Bold:size=11}CPU
${goto 220}${font Zekton:style=Bold:size=11}${color0}${cpu cpu1}%
${voffset 30}${goto 82}${color1}/home
${goto 82}${font Zekton:style=Bold:size=10}${color0}${fs_used /home}
${voffset 35}${goto 25}${font Zekton:style=Bold:size=10}${color1}${goto 113}/dev/sda${font Zekton:style=Bold:size=11}${goto 217}RAM
${goto 30}${font Zekton:style=Bold:size=9}${color1}${goto 120}${diskio /dev/sda} ${goto 220}${font Zekton:style=Bold:size=11}${color0}${memperc}%
${voffset 16}${font Zekton:style=Bold:size=11}${color0}${goto 83}ROOT${color2}${goto 175}SWAP
${font Zekton:style=Bold:size=9}${color0}${goto 83}${fs_used /}${color2}${goto 175}${swapperc}%

${image ~/.conky/victorConky/LinuxMedium-fuchsia-clean.png -p 10,0}
