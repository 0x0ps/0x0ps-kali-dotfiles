# 0x0ps Neon Matrix — Kitty configuration
enable_audio_bell no

# Keep all terminal colors in one palette file.
include color.ini

font_family      HackNerdFont
font_size 12
disable_ligatures never

url_color #00FFFF
url_style curly

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Clear screen and scrollback
map alt+c clear_terminal reset active

# 0x0ps Kitty internal splits
map shift+alt+h launch --location=hsplit --cwd=current
map shift+alt+v launch --location=vsplit --cwd=current
map shift+alt+w close_window

# 0x0ps Kitty pane resizing
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter

map F1 copy_to_buffer a
map F2 paste_from_buffer a
map F3 copy_to_buffer b
map F4 paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8
mouse_hide_wait 3.0
detect_urls yes
repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline
active_tab_foreground #000000
active_tab_background #A6FF00
inactive_tab_foreground #667066
inactive_tab_background #101010
tab_bar_margin_color #000000

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

background_opacity 0.45
shell zsh
