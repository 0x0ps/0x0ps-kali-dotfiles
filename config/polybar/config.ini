;==========================================================
;
;   0x0ps Neon Matrix — Polybar configuration
;
;==========================================================

[colors]
background = #AA000000
background-alt = #151515
foreground = #D7F7D7
primary = #A6FF00
secondary = #FF00AF
disabled = #667066
alert = #FF5C5C
green = #A6FF00
yellow = #A6FF00
blue = #00FFFF
purple = #FF00AF
aqua = #00FFFF
red = #FF5C5C
black = #000000
b = #101010

[bar/bar]
width = 80%
offset-x = 10%
offset-y = 5
override-redirect = true
fixed-center = true
height = 36pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 2pt
border-color = ${colors.secondary}

padding-left = 0
padding-right = 1

module-margin = 1

#separator = |
separator-foreground = ${colors.disabled}

#font-0 = monospace;2
font-0 = "Hack Nerd Font:size=10;2"
font-1 = "Hack Nerd Font:size=13;2"
font-2 = "Hack Nerd Font:size=22;5"
font-3 = "0x0ps Burp Icons:size=22;5"
modules-left = brand i3
modules-center = launcher-kitty launcher-firefox launcher-burp launcher-files launcher-flameshot
modules-right = htb eth0 htb_target date
#filesystem, htb , eth
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true


[module/brand]
type = custom/text
content = null0x
content-foreground = ${colors.primary}
content-padding = 1

[module/i3]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.sh
interval = 1
label = %output%
format = <label>

; Centered application launchers — click an icon to launch the app.
[module/launcher-kitty]
type = custom/text
content = "%{T3}%{T-}"
content-foreground = ${colors.primary}
content-padding = 1
click-left = kitty

[module/launcher-firefox]
type = custom/text
content = "%{T3}󰈹%{T-}"
content-foreground = ${colors.foreground}
content-padding = 1
click-left = firefox

[module/launcher-burp]
type = custom/text
content = "%{T4}%{T-}"
content-foreground = #FD7D00
content-padding = 1
click-left = burpsuite
[module/launcher-files]
type = custom/text
content = "%{T3}%{T-}"
content-foreground = ${colors.blue}
content-padding = 1
click-left = thunar

[module/launcher-flameshot]
type = custom/text
content = "%{T3}󰹑%{T-}"
content-foreground = ${colors.primary}
content-padding = 1
click-left = flameshot gui

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.yellow}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.blue}
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
#label-mounted = %{} %mountpoint%%{F-} %percentage_used%%
label-mounted =  %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/htb_target]
type = custom/script
interval = 2
exec = ~/.config/bin/htb_target.sh

[module/htb]
type = custom/script
interval = 2
exec = ~/.config/bin/htb.sh

[module/eth0]
type = custom/script
interval = 2
exec = ~/.config/bin/eth.sh

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "♪ "
format-volume-prefix-foreground = ${colors.green}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.purple}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.aqua}
formant-foreground = ${colors.foreground}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#00FFFF}%ifname%%{F#667066} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#00FFFF}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
format=prefix = "󰈀 "
label-connected = 󰈀  %local_ip%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
format-prefix = "󱑒 "
format-prefix-foreground = ${colors.red}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
